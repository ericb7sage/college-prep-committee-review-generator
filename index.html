<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>7Sage Committee Review Generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css?v=20260805" />
    <link rel="stylesheet" href="./star-fix.css?v=20260805b" />
  </head>
  <body>
    <header class="topbar">
      <img src="./assets/logo-7sage-b2r2.svg" alt="7Sage" />
      <div><p>College Admissions</p><h1>Committee Review Generator</h1></div>
    </header>

    <main class="app-shell">
      <section id="workspace" class="workspace">
        <aside class="editor-pane">
          <div class="editor-heading">
            <div><p class="eyebrow">Consultant editor</p><h2>Edit report</h2></div>
            <div class="file-actions">
              <button id="resetReport" class="text-button" type="button">Clear form</button>
            </div>
          </div>

          <form id="reportForm" novalidate>
            <fieldset>
              <legend>Student information</legend>
              <div class="field-grid">
                <label><span>Student name</span><input data-path="student.name" type="text" /></label>
                <label><span>Test type</span><select data-path="student.testType"><option>SAT</option><option>ACT</option></select></label>
                <label><span>Test score</span><input data-path="student.testScore" type="text" /></label>
                <label><span>GPA</span><input data-path="student.gpa" type="text" /></label>
                <label class="wide"><span>Target school</span><input data-path="student.targetSchool" type="text" /></label>
              </div>
            </fieldset>

            <fieldset>
              <legend>Overall summary</legend>
              <label class="textarea-field">
                <span>Consultant summary</span>
                <textarea data-path="consultantSummary" rows="8" placeholder="Synthesize the reviewers’ feedback for the student..."></textarea>
                <span class="field-meta"><span data-count="consultantSummary">0 characters</span><span data-fit="summary" class="fit-badge">Fits</span></span>
              </label>
            </fieldset>

            <div id="reviewerEditors"></div>
          </form>
        </aside>

        <section class="preview-pane">
          <div class="preview-toolbar">
            <div><p class="eyebrow">Live preview</p><h2>Two-page report</h2></div>
            <button id="exportPdf" class="primary-button" type="button">Export PDF</button>
          </div>
          <div id="fitAlert" class="fit-alert" aria-live="polite"></div>
          <div id="previewPages" class="preview-pages"></div>
        </section>
      </section>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="./app.js?v=20260805b"></script>
  </body>
</html>
